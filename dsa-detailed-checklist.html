<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Detailed Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2eb;
  --bg2: #ede9df;
  --surface: #ffffff;
  --border: #d8d2c4;
  --text: #1a1714;
  --muted: #8a8070;
  --ink: #2d2720;

  --p1: #c0392b; /* Foundations */
  --p2: #d4750a; /* Core DS */
  --p3: #1a6b3c; /* Algorithms */
  --p4: #1a4b8c; /* DP */
  --p5: #6b2d8c; /* Advanced */

  --done-bg: #e8f5ee;
  --done-border: #4caf7d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 60L60 0M-10 10L10-10M50 70L70 50' stroke='%23c9c3b4' stroke-width='0.5' fill='none'/%3E%3C/svg%3E");
}

.container {
  max-width: 860px;
  margin: 0 auto;
  padding: 48px 20px 80px;
}

/* Header */
header {
  margin-bottom: 48px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  animation: fadeIn 0.5s ease;
}

.header-left {}

.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

h1 {
  font-weight: 900;
  font-size: clamp(2rem, 5vw, 3.2rem);
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--ink);
}

h1 em {
  font-style: normal;
  display: block;
  font-weight: 300;
  font-size: 0.48em;
  letter-spacing: 0.01em;
  color: var(--muted);
  margin-top: 4px;
}

/* Stats bar */
.stats-row {
  display: flex;
  gap: 16px;
  margin-bottom: 36px;
  flex-wrap: wrap;
  animation: fadeIn 0.5s 0.1s ease both;
}

.stat-box {
  background: var(--surface);
  border: 1.5px solid var(--border);
  padding: 14px 20px;
  flex: 1;
  min-width: 100px;
}

.stat-num {
  font-weight: 700;
  font-size: 1.6rem;
  line-height: 1;
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
}

.stat-label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 4px;
}

/* Overall progress */
.overall-prog {
  margin-bottom: 36px;
  animation: fadeIn 0.5s 0.15s ease both;
}

.prog-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.prog-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--muted);
}

.prog-pct {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}

.prog-track {
  height: 6px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}

.prog-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--ink);
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}

/* Filter tabs */
.filter-row {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
  flex-wrap: wrap;
  animation: fadeIn 0.5s 0.2s ease both;
}

.filter-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 14px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}

.filter-btn:hover, .filter-btn.active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* Phase */
.phase {
  margin-bottom: 28px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  animation: slideUp 0.4s ease both;
}

.phase:nth-child(1) { animation-delay: 0.1s; }
.phase:nth-child(2) { animation-delay: 0.17s; }
.phase:nth-child(3) { animation-delay: 0.24s; }
.phase:nth-child(4) { animation-delay: 0.31s; }
.phase:nth-child(5) { animation-delay: 0.38s; }

.phase-header {
  display: flex;
  align-items: center;
  padding: 18px 20px;
  cursor: pointer;
  gap: 14px;
  border-bottom: 1.5px solid transparent;
  transition: background 0.15s;
  user-select: none;
}

.phase.open .phase-header {
  border-bottom-color: var(--border);
}

.phase-header:hover { background: var(--bg); }

.phase-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--phase-color);
}

.phase-title-wrap { flex: 1 }
.phase-name {
  font-weight: 700;
  font-size: 1rem;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.phase-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
}

.phase-prog-wrap { display: flex; align-items: center; gap: 10px; }
.phase-prog-bar {
  width: 80px;
  height: 3px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}
.phase-prog-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--phase-color);
  transition: width 0.4s ease;
}
.phase-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  min-width: 40px;
  text-align: right;
}

.phase-chevron {
  color: var(--muted);
  font-size: 12px;
  transition: transform 0.25s;
}
.phase.open .phase-chevron { transform: rotate(180deg); }

/* Phase body */
.phase-body { display: none; }
.phase.open .phase-body { display: block; }

/* Topic section */
.topic-section {
  border-bottom: 1px solid var(--bg2);
}
.topic-section:last-child { border-bottom: none; }

.topic-section-header {
  padding: 12px 20px 12px 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  user-select: none;
}

.topic-section-header:hover { background: var(--bg2); }

.ts-icon {
  font-size: 14px;
  width: 22px;
  text-align: center;
}
.ts-name {
  font-weight: 600;
  font-size: 13px;
  flex: 1;
  color: var(--ink);
}
.ts-diff {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 2px 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.diff-easy   { background: #e6f9ef; color: #1a6b3c; border: 1px solid #b2dfc5; }
.diff-medium { background: #fff3e2; color: #d4750a; border: 1px solid #f0c98a; }
.diff-hard   { background: #f3eaf9; color: #6b2d8c; border: 1px solid #ceaae6; }

.ts-chevron { font-size: 10px; color: var(--muted); transition: transform 0.2s; }
.topic-section.open .ts-chevron { transform: rotate(180deg); }
.topic-section-body { display: none; }
.topic-section.open .topic-section-body { display: block; }

/* Checklist items */
.check-group {
  padding: 14px 20px 14px 44px;
  border-bottom: 1px solid var(--bg2);
}
.check-group:last-child { border-bottom: none; }

.check-group-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--muted);
  margin-bottom: 10px;
  padding-left: 28px;
}

.check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 5px 0;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.1s;
}
.check-item:hover { background: var(--bg); }

.check-box {
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  transition: all 0.15s;
}
.check-item.done .check-box {
  background: var(--done-border);
  border-color: var(--done-border);
  color: white;
}

.check-text {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.5;
  flex: 1;
}
.check-item.done .check-text {
  color: var(--muted);
  text-decoration: line-through;
}

.check-note {
  font-size: 10px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
}

/* Resources link row */
.resource-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 4px;
}
.resource-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 2px 7px;
  background: var(--bg2);
  color: var(--muted);
  border: 1px solid var(--border);
  letter-spacing: 0.05em;
}

/* Reset */
.footer-row {
  margin-top: 40px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.action-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 10px 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.action-btn:hover { border-color: var(--ink); color: var(--ink); }
.action-btn.danger:hover { border-color: var(--p1); color: var(--p1); }

@keyframes fadeIn {
  from { opacity: 0; } to { opacity: 1; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

const STORE_KEY = 'dsa_v2_done';
let done = (() => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; } })();
let currentFilter = 'all';

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(done)); } catch {} }

function itemId(pi, ti, gi, ii) { return `${pi}_${ti}_${gi}_${ii}`; }

function getAllIds() {
  const ids = [];
  data.forEach((phase, pi) => phase.topics.forEach((topic, ti) =>
    topic.groups.forEach((g, gi) => g.items.forEach((_, ii) => ids.push(itemId(pi,ti,gi,ii))))));
  return ids;
}

function updateStats() {
  const all = getAllIds();
  const total = all.length;
  const d = all.filter(id => done[id]).length;
  const pct = total ? Math.round(d / total * 100) : 0;
  document.getElementById('stat-done').textContent = d;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('stat-left').textContent = total - d;
  document.getElementById('main-fill').style.width = pct + '%';
  document.getElementById('prog-pct-label').textContent = pct + '%';

  // Per-phase progress bars
  data.forEach((phase, pi) => {
    const phaseIds = [];
    phase.topics.forEach((topic, ti) =>
      topic.groups.forEach((g, gi) => g.items.forEach((_, ii) => phaseIds.push(itemId(pi,ti,gi,ii)))));
    const pd = phaseIds.filter(id => done[id]).length;
    const pp = phaseIds.length ? Math.round(pd / phaseIds.length * 100) : 0;
    const fill = document.getElementById(`pp-fill-${pi}`);
    const count = document.getElementById(`pp-count-${pi}`);
    if (fill) fill.style.width = pp + '%';
    if (count) count.textContent = `${pd}/${phaseIds.length}`;
  });
}

function toggleItem(id, el) {
  done[id] = !done[id];
  save();
  el.classList.toggle('done', done[id]);
  el.querySelector('.check-box').textContent = done[id] ? '✓' : '';
  updateStats();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.check-item').forEach(el => {
    const id = el.dataset.id;
    const isDone = done[id];
    const diff = el.dataset.diff;
    let show = true;
    if (f === 'easy' || f === 'medium' || f === 'hard') show = diff === f;
    else if (f === 'done') show = isDone;
    else if (f === 'todo') show = !isDone;
    el.style.display = show ? '' : 'none';
  });
}

function expandAll() {
  document.querySelectorAll('.phase, .topic-section').forEach(el => el.classList.add('open'));
}

function collapseAll() {
  document.querySelectorAll('.phase, .topic-section').forEach(el => el.classList.remove('open'));
}

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  done = {};
  save();
  document.querySelectorAll('.check-item').forEach(el => {
    el.classList.remove('done');
    el.querySelector('.check-box').textContent = '';
  });
  updateStats();
}

function render() {
  const wrap = document.getElementById('phases-wrap');

  data.forEach((phase, pi) => {
    const phaseEl = document.createElement('div');
    phaseEl.className = 'phase';
    phaseEl.style.setProperty('--phase-color', phase.color);

    const topicsHtml = phase.topics.map((topic, ti) => {
      const groupsHtml = topic.groups.map((g, gi) => {
        const itemsHtml = g.items.map((item, ii) => {
          const id = itemId(pi, ti, gi, ii);
          const isDone = done[id];
          return `<div class="check-item ${isDone ? 'done' : ''}" data-id="${id}" data-diff="${topic.diff}" onclick="toggleItem('${id}', this)">
            <div class="check-box">${isDone ? '✓' : ''}</div>
            <div>
              <div class="check-text">${item.text}</div>
              ${item.note ? `<div class="check-note">→ ${item.note}</div>` : ''}
            </div>
          </div>`;
        }).join('');
        return `<div class="check-group"><div class="check-group-label">${g.label}</div>${itemsHtml}</div>`;
      }).join('');

      return `<div class="topic-section">
        <div class="topic-section-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="ts-icon">${topic.icon}</span>
          <span class="ts-name">${topic.name}</span>
          <span class="ts-diff diff-${topic.diff}">${topic.diff}</span>
          <span class="ts-chevron">▾</span>
        </div>
        <div class="topic-section-body">${groupsHtml}</div>
      </div>`;
    }).join('');

    phaseEl.innerHTML = `
      <div class="phase-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="phase-dot"></div>
        <div class="phase-title-wrap">
          <div class="phase-name">${phase.name}</div>
          <div class="phase-sub">${phase.weeks}</div>
        </div>
        <div class="phase-prog-wrap">
          <div class="phase-prog-bar"><div class="phase-prog-fill" id="pp-fill-${pi}" style="width:0%"></div></div>
          <div class="phase-count" id="pp-count-${pi}">0/0</div>
        </div>
        <div class="phase-chevron">▾</div>
      </div>
      <div class="phase-body">${topicsHtml}</div>`;

    wrap.appendChild(phaseEl);
  });

  // Open first phase by default
  wrap.querySelector('.phase').classList.add('open');
  updateStats();
}

render();
